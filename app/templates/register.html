{% extends 'base.html' %}{% block title %}Create account · WebGuard{% endblock %}{% block content %}<div class="auth-card card"><div class="card-body"><h1 class="h3">Create account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required minlength="3" maxlength="32"><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required maxlength="254"><label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" required minlength="10" maxlength="128"><div class="form-text mb-3">Use at least 10 characters, including a letter and a number.</div><button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></div></div>{% endblock %}
